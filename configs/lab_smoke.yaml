# Plumbing check with tiny models: exercises EVERY stage and detector on a real GPU. Numbers are NOT meaningful.
models:
  scorer: HuggingFaceTB/SmolLM2-360M
  infiller: Qwen/Qwen2.5-1.5B-Instruct
  quantize_4bit: false
  dtype: float16
gen:
  batch_size: 4
  max_attempts: 2
lab:
  generator: Qwen/Qwen2.5-0.5B
  n_samples: 12
  algorithms: [kgw, exp, synthid]
  attacks: [sira, random, paraphrase]
  detectors: [fast_detectgpt, binoculars]
  fdg_model: Qwen/Qwen2.5-0.5B
  bino_observer: Qwen/Qwen2.5-0.5B
  bino_performer: Qwen/Qwen2.5-0.5B-Instruct
  gen_batch_size: 6
  attack_batch_size: 6
