[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sira-lab"
version = "0.1.0"
description = "SIRA-style rewriting and text-watermark robustness evaluation (research toolkit)"
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy"]

[tool.setuptools.packages.find]
include = ["sira_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
